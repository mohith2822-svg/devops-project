apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: flask-app
  name: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  strategy: {}
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - image: devops-project-web:1.0
        imagePullPolicy: IfNotPresent
        name: devops-project-web
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        env:

          - name: APP_VERSION
            value: "1.0"  
          - name: APP_ENV
            valueFrom:
              configMapKeyRef:
                name: flask-config
                key: APP_ENV
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: flask-secret
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: flask-secret
                key: DB_PASSWORD
status: {}
